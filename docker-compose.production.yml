services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env.production
    restart: unless-stopped
    # This host has about 1.6 GiB of usable RAM. Keep enough physical memory
    # available for Linux, Docker, Caddy, and Nginx while allowing the private
    # model-training pipeline to spill into a bounded amount of host swap.
    # memswap_limit is the combined RAM + swap ceiling, not swap alone.
    mem_limit: 1g
    memswap_limit: 2500m
    cpus: 1.5
    pids_limit: 256
    volumes:
      # ECS-local persistent state. Do not mount these from network storage.
      - ./backend/data:/app/backend/data
      - ./analysis/exports:/app/analysis/exports
      - ./analysis/outputs:/app/analysis/outputs
      - ./analysis/published:/app/analysis/published
    expose:
      - "8000"
    networks:
      - kpl_internal

  web:
    build:
      context: frontend
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    # Public traffic is terminated by Caddy, which provides automatic HTTPS.
    # Do not publish this port directly: keeping it internal ensures all
    # public browser traffic reaches the TLS gateway first.
    expose:
      - "80"
    volumes:
      - ./deploy/.htpasswd:/etc/nginx/auth/.htpasswd:ro
      # Public aggregate analysis data is generated by the API, then served
      # directly by Nginx without replacing Vite's built /assets bundles.
      - ./analysis/published/data:/usr/share/nginx/html/assets/data:ro
    networks:
      - kpl_internal

  caddy:
    image: caddy:2.10-alpine
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Keep ACME certificates and Caddy's account data across redeployments.
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - kpl_internal

networks:
  kpl_internal:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
