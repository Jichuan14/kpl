upstream kpl_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # FastAPI previously compressed analytical payloads. Keep that benefit when
    # Nginx serves the published JSON directly.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json text/css application/javascript application/x-javascript image/svg+xml application/xml;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;

    # Keep the admin UI and all data-changing operations private.
    location = /management {
        auth_basic "KPL management";
        auth_basic_user_file /etc/nginx/auth/.htpasswd;
        try_files $uri /index.html;
    }

    location ^~ /api/sync/ {
        auth_basic "KPL management";
        auth_basic_user_file /etc/nginx/auth/.htpasswd;
        proxy_pass http://kpl_api;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location ^~ /api/pipeline/ {
        auth_basic "KPL management";
        auth_basic_user_file /etc/nginx/auth/.htpasswd;
        proxy_pass http://kpl_api;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Local database and per-match records are never public download endpoints.
    location ^~ /api/data/ {
        auth_basic "KPL management";
        auth_basic_user_file /etc/nginx/auth/.htpasswd;
        proxy_pass http://kpl_api;
        include /etc/nginx/proxy_params;
    }

    location ^~ /api/bp/ {
        auth_basic "KPL management";
        auth_basic_user_file /etc/nginx/auth/.htpasswd;
        proxy_pass http://kpl_api;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 900s;
    }

    # The public simulator needs only the season list and selectable teams.
    # These endpoints expose no credentials or raw match data.
    location = /api/leagues {
        proxy_pass http://kpl_api;
        include /etc/nginx/proxy_params;
    }

    location ~ ^/api/leagues/[^/]+/teams$ {
        proxy_pass http://kpl_api;
        include /etc/nginx/proxy_params;
    }

    # Keep any other current or future league-management endpoints private.
    # Do not use ^~ here: the public team-list regex above must be evaluated.
    location /api/leagues {
        auth_basic "KPL management";
        auth_basic_user_file /etc/nginx/auth/.htpasswd;
        proxy_pass http://kpl_api;
        include /etc/nginx/proxy_params;
    }

    location ^~ /api/visualization/ {
        auth_basic "KPL management";
        auth_basic_user_file /etc/nginx/auth/.htpasswd;
        proxy_pass http://kpl_api;
        include /etc/nginx/proxy_params;
    }

    # Capacity statistics and runtime limit controls are shown only on the
    # management screen. Keep them private while leaving POST /api/coach
    # available to public Draft Coach visitors.
    location = /api/coach/usage {
        auth_basic "KPL management";
        auth_basic_user_file /etc/nginx/auth/.htpasswd;
        proxy_pass http://kpl_api;
        include /etc/nginx/proxy_params;
    }

    location = /api/coach/limits {
        auth_basic "KPL management";
        auth_basic_user_file /etc/nginx/auth/.htpasswd;
        proxy_pass http://kpl_api;
        include /etc/nginx/proxy_params;
    }

    # Public pages send an anonymous, aggregate-only page-view signal. The
    # dashboard summary itself remains private with the management interface.
    location = /api/analytics/visits {
        proxy_pass http://kpl_api;
        include /etc/nginx/proxy_params;
    }

    location = /api/analytics/summary {
        auth_basic "KPL management";
        auth_basic_user_file /etc/nginx/auth/.htpasswd;
        proxy_pass http://kpl_api;
        include /etc/nginx/proxy_params;
    }

    # Generated by the analysis pipeline and mounted from persistent storage.
    # These files never involve FastAPI during normal public page loads.
    location ^~ /assets/data/ {
        alias /usr/share/nginx/html/assets/data/;
        # Published assets are atomically replaced under stable names.
        add_header Cache-Control "no-cache" always;
    }

    # Bundled hero icons are part of the frontend image assets, not remote URLs.
    location ^~ /assets/heroes/ {
        alias /usr/share/nginx/html/assets/heroes/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location /api/ {
        proxy_pass http://kpl_api;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://kpl_api;
        include /etc/nginx/proxy_params;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
